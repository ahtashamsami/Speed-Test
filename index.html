            }
          },
          {
            "@type": "Organization",
            "@id": "#ecorzo-organization",
            "name": "ECORZO LLC",

            "telephone": "+1-646-427-6802",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "224 W 35th St STE 500",
              "addressLocality": "New York",
              "addressRegion": "NY",

              "addressCountry": "US"

          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How does TestLine measure internet download and upload speed?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "TestLine runs real-time browser-to-edge transfers against Cloudflare public speed endpoints. Download speed uses 3 parallel 25 MB fetch streams over a 10-second window, while upload speed measures 2 parallel 10 MB binary POST streams using XMLHttpRequest upload progress events."
                }
              },
              {
                "@type": "Question",
                "name": "What are good ping and jitter values for video calls and gaming?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "For smooth video conferencing and online gaming, an average ping under 30 ms and jitter below 10 ms are considered optimal. Ping between 30 ms and 75 ms remains responsive for general browsing, while jitter above 25 ms can cause voice stutter or packet delay."
                }
              },
              {
                "@type": "Question",
                "name": "How do I check my public IPv4 and IPv6 address?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "TestLine automatically resolves your public IP address on page load by probing both dual-stack client endpoints and edge headers. If your ISP supports dual-stack routing, both your IPv4 and IPv6 addresses appear side by side with one-click copy buttons."
                }
              },
              {
                "@type": "Question",
                "name": "How does TestLine detect a VPN, proxy, or datacenter relay?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "TestLine evaluates proxy forwarding headers, hosting and datacenter Autonomous System Numbers (ASNs), known relay PTR hostnames, and browser-versus-IP timezone mismatches. When any signal triggers, a dedicated Proxy & VPN Detection card lists every matched indicator."
                }
              },
              {
                "@type": "Question",
                "name": "What is DNS-over-HTTPS (DoH) latency and Reverse DNS (PTR)?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "DNS-over-HTTPS (DoH) latency measures how quickly your connection resolves domain queries over encrypted HTTPS via Cloudflare 1.1.1.1. Reverse DNS (PTR) reveals the canonical hostname mapped back to your public IP address by your internet carrier."
                }
              },
              {
                "@type": "Question",
                "name": "Does ECORZO LLC store my IP address or speed test data?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. IP lookups and speed tests are processed ephemerally in memory and never sold or stored in permanent user profiles. Recent run history is saved strictly inside your own browser storage, and exported PDF reports are generated locally on your device."
                }
              }
            ]
          },

                "text": "Load the TestLine single-page tool. Latency, download speed, upload speed, and IP diagnostics begin automatically."

                "text": "Inspect download, upload, average ping, jitter, public IPv4/IPv6 addresses, ISP/ASN, DNS DoH latency, and any detected proxy or VPN signals."
              },

                "@type": "HowToStep",
                "position": 3,

              }
            ]

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('testline_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
